# Sidecar in every web pod: serves built assets and the site's public files,
# and passes everything else to gunicorn on localhost.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    client_max_body_size 50m;
    server {
        listen 8080;
        root /home/frappe/frappe-bench/sites;
        location /assets {
            try_files $uri =404;
            expires 1h;
        }
        location ~ ^/files/.*\.(htm|html|svg|xml) {
            add_header Content-disposition "attachment";
            try_files /$http_x_frappe_site_name/public/$uri @app;
        }
        location /files {
            try_files /$http_x_frappe_site_name/public/$uri @app;
        }
        location / {
            try_files /nonexistent @app;
        }
        location @app {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Frappe-Site-Name $http_x_frappe_site_name;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }
    }
}
