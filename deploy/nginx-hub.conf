# /etc/nginx/conf.d/stackpilot-hub.conf — StackPilot on its own hostname and certificate.
limit_req_zone $binary_remote_addr zone=sp_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=sp_auth:10m rate=10r/m;
map $http_upgrade $sp_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name hub.3-131-57-88.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/taskflow-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.3-131-57-88.sslip.io;
    ssl_certificate /etc/letsencrypt/live/stackpilot-hub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stackpilot-hub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/method/login { limit_req zone=sp_auth burst=5 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8090; include /etc/nginx/stackpilot-proxy.inc; }
    location /api/ { limit_req zone=sp_api burst=40 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8090; include /etc/nginx/stackpilot-proxy.inc; }
    location /socket.io {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sp_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name hub.3-131-57-88.sslip.io;
    }
    location /assets/ { proxy_pass http://127.0.0.1:8090; include /etc/nginx/stackpilot-proxy.inc; expires 7d; }
    location / { proxy_pass http://127.0.0.1:8090; include /etc/nginx/stackpilot-proxy.inc; }
}
